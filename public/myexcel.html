<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Book1 - Excel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,Segoe UI,Arial,sans-serif;font-size:11px;background:#fff;color:#000;overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}

/* ── Title bar ── */
#titlebar{height:30px;background:#217346;display:flex;align-items:center;padding:0 0 0 6px;flex-shrink:0;gap:0}
.xl-logo{display:flex;align-items:center;gap:4px;padding:0 6px 0 2px}
.xl-logo svg{width:16px;height:16px}
.xl-logo span{color:#fff;font-size:12px;font-weight:600}
.tb-sep{width:1px;height:16px;background:rgba(255,255,255,.3);margin:0 4px}
.qat-btn{width:24px;height:24px;background:transparent;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;border-radius:2px;opacity:.9}
.qat-btn:hover{background:rgba(255,255,255,.2);opacity:1}
.qat-btn svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2}
#file-title{flex:1;text-align:center;color:#fff;font-size:12px;font-weight:400;pointer-events:none}
.win-btns{display:flex}
.wb{width:46px;height:30px;background:transparent;border:none;cursor:pointer;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;opacity:.9}
.wb:hover{background:rgba(255,255,255,.2);opacity:1}
.wb.wclose:hover{background:#c42b1c;opacity:1}

/* ── Ribbon tabs ── */
#ribbon-tabs{height:28px;background:#fff;display:flex;align-items:flex-end;padding:0 2px;border-bottom:1px solid #d1d1d1;flex-shrink:0}
.file-tab{height:22px;padding:0 14px;background:#217346;color:#fff;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;border-radius:0;margin-right:4px;margin-bottom:-1px}
.file-tab:hover{background:#1a5c38}
.rtab{height:22px;padding:0 12px;font-size:11px;color:#444;cursor:pointer;display:flex;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.rtab:hover{color:#000;background:#f0f0f0}
.rtab.active{color:#217346;font-weight:600;border-bottom:2px solid #217346}

/* ── Ribbon body ── */
#ribbon{background:#f3f3f3;border-bottom:1px solid #d1d1d1;flex-shrink:0;display:flex;align-items:stretch;padding:3px 4px 0;height:68px;overflow:hidden}
.rg{display:flex;flex-direction:column;flex-shrink:0}
.rg-inner{flex:1;display:flex;align-items:flex-start;gap:2px;padding:0 6px}
.rg-label{height:16px;font-size:9.5px;color:#666;text-align:center;width:100%;padding:0 2px;display:flex;align-items:center;justify-content:center;gap:2px}
.rg-sep{width:1px;background:#d1d1d1;margin:2px 4px;align-self:stretch}
/* large button (paste) */
.rb-lg{width:46px;height:48px;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:#333;padding:2px}
.rb-lg:hover{background:#e3e3e3;border-color:#c8c8c8}
.rb-lg.active{background:#d9ecf5;border-color:#90c8e0}
.rb-lg svg{width:22px;height:22px}
/* small button */
.rb{height:22px;min-width:22px;padding:0 4px;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:11px;color:#333;white-space:nowrap}
.rb:hover{background:#e3e3e3;border-color:#c8c8c8}
.rb.active{background:#d9ecf5;border-color:#90c8e0}
.rb svg{width:14px;height:14px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.5}
/* icon-only small */
.rb-ic{width:24px;height:22px;padding:0;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:Calibri,Arial,sans-serif}
.rb-ic:hover{background:#e3e3e3;border-color:#c8c8c8}
.rb-ic.active{background:#d9ecf5;border-color:#90c8e0}
/* stack of 2 small buttons */
.rb-stack{display:flex;flex-direction:column;gap:1px}
/* font inputs */
.fn-input{height:22px;border:1px solid #c0c0c0;background:#fff;font:11px Calibri,Arial,sans-serif;padding:0 4px;border-radius:1px;outline:none}
.fn-input:focus{border-color:#217346}
#font-name{width:128px}
#font-size{width:38px;text-align:center}
/* number format select */
#num-fmt{height:22px;border:1px solid #c0c0c0;background:#fff;font:11px Calibri,Arial,sans-serif;padding:0 2px;border-radius:1px;width:110px;outline:none}
#num-fmt:focus{border-color:#217346}
/* color button with stripe */
.rb-clr{width:28px;height:22px;padding:0;background:transparent;border:1px solid transparent;border-radius:2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.rb-clr:hover{background:#e3e3e3;border-color:#c8c8c8}
.clr-stripe{width:16px;height:3px;border-radius:1px}

/* ── Formula bar ── */
#fbar{height:26px;display:flex;align-items:center;border-bottom:1px solid #d1d1d1;background:#fff;flex-shrink:0}
#name-box{width:62px;min-width:62px;height:26px;border:none;border-right:1px solid #d1d1d1;padding:0 6px;font:11px Calibri,Arial,sans-serif;text-align:center;outline:none}
#name-box:focus{border-color:#217346;outline:none}
.fb-btn{width:22px;height:26px;border:none;background:transparent;cursor:pointer;color:#555;font-size:11px;display:flex;align-items:center;justify-content:center;border-right:1px solid #d1d1d1}
.fb-btn:hover{background:#eee;color:#000}
#fb-cancel{color:#cc0000}
#fb-accept{color:#217346;font-weight:700}
#fx-btn{font-style:italic;font-family:'Cambria Math',Georgia,serif;font-size:13px;letter-spacing:-0.5px}
#formula-input{flex:1;height:26px;border:none;padding:0 6px;font:11px Calibri,Arial,sans-serif;outline:none}

/* ── Sheet / grid area ── */
#sheet-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#grid-wrap{flex:1;position:relative;overflow:hidden}
canvas#grid-canvas{display:block;cursor:cell}
#vscroll{width:15px;overflow-y:scroll;overflow-x:hidden;position:absolute;right:0;top:0;bottom:0}
#vscroll-inner{width:1px}
#hscroll{height:15px;overflow-x:scroll;overflow-y:hidden;flex-shrink:0}
#hscroll-inner{height:1px}

/* ── Sheet tabs ── */
#tabs-bar{height:24px;display:flex;align-items:center;background:#f0f0f0;border-top:1px solid #d1d1d1;flex-shrink:0;padding:0 4px;gap:1px}
.tab-nav-btn{width:18px;height:18px;border:1px solid #bbb;background:#e8e8e8;cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;border-radius:1px}
.tab-nav-btn:hover{background:#d4d4d4}
.tab-nav-sep{width:1px;height:16px;background:#ccc;margin:0 3px}
.sheet-tab{height:20px;padding:0 12px;border:1px solid #c0c0c0;border-bottom:none;background:#dcdcdc;cursor:pointer;font-size:11px;display:flex;align-items:center;border-top-left-radius:3px;border-top-right-radius:3px;margin-top:3px;white-space:nowrap}
.sheet-tab.active{background:#fff;border-color:#c0c0c0;border-bottom:1px solid #fff;margin-top:1px;z-index:1;position:relative}
.sheet-tab:not(.active):hover{background:#d0d0d0}
#add-sheet{width:20px;height:20px;border:none;background:transparent;cursor:pointer;font-size:16px;color:#666;display:flex;align-items:center;justify-content:center;margin-left:2px;border-radius:2px}
#add-sheet:hover{background:#d4d4d4}

/* ── Status bar ── */
#statusbar{height:22px;display:flex;align-items:center;background:#f0f0f0;border-top:1px solid #d1d1d1;color:#333;font-size:11px;padding:0 8px;flex-shrink:0;gap:16px}
#status-left{color:#333}
#status-stats{display:flex;gap:14px;flex:1}
#status-stats span{font-size:11px;color:#333}
#zoom-area{display:flex;align-items:center;gap:6px;margin-left:auto}
#zoom-out-btn,#zoom-in-btn{width:16px;height:16px;border:1px solid #bbb;background:#e8e8e8;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;border-radius:1px}
#zoom-out-btn:hover,#zoom-in-btn:hover{background:#d4d4d4}
#zoom-slider{width:80px;accent-color:#217346}
#zoom-val{width:36px;font-size:11px;text-align:right;color:#333}

/* ── Context menu ── */
#ctx-menu{position:fixed;background:#fff;border:1px solid #bbb;box-shadow:2px 4px 12px rgba(0,0,0,.2);z-index:9999;display:none;min-width:170px;padding:3px 0;font-size:11px}
.ctx-item{padding:5px 20px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:#e5f0ff}
.ctx-sep{height:1px;background:#e8e8e8;margin:3px 0}

/* ── Color picker ── */
#color-popup{position:fixed;background:#fff;border:1px solid #bbb;box-shadow:2px 4px 12px rgba(0,0,0,.2);z-index:9998;display:none;padding:8px;border-radius:2px;width:180px}
.cp-title{font-size:10px;color:#666;margin-bottom:5px}
.cp-row{display:flex;gap:3px;margin-bottom:3px}
.cp-swatch{width:20px;height:20px;border:1px solid rgba(0,0,0,.15);cursor:pointer;border-radius:1px;flex-shrink:0}
.cp-swatch:hover{outline:2px solid #217346;outline-offset:1px;z-index:1;position:relative}

/* ── Misc ── */
#autocomplete{position:fixed;background:#fff;border:1px solid #999;box-shadow:1px 2px 8px rgba(0,0,0,.2);z-index:9997;display:none;min-width:120px}
.ac-item{padding:3px 10px;font-size:11px;cursor:pointer}
.ac-item:hover,.ac-item.selected{background:#217346;color:#fff}
</style>
</head>
<body>

<!-- ── Title bar ── -->
<div id="titlebar">
  <div class="xl-logo">
    <svg viewBox="0 0 16 16"><rect width="16" height="16" rx="2" fill="#fff"/><path d="M3 3h4v2H3V3zm0 3h4v2H3V6zm0 3h4v2H3V9zm5-6h5v2H8V3zm0 3h5v2H8V6zm0 3h5v2H8V9zm-5 3h10v2H3v-2z" fill="#217346"/></svg>
    <span>Excel</span>
  </div>
  <div class="tb-sep"></div>
  <button class="qat-btn" onclick="saveToLocal()" title="Save (Ctrl+S)">
    <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
  </button>
  <button class="qat-btn" onclick="undo()" title="Undo (Ctrl+Z)">
    <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>
  </button>
  <button class="qat-btn" onclick="redo()" title="Redo (Ctrl+Y)">
    <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-3.5"/></svg>
  </button>
  <button class="qat-btn" onclick="window.location='/'" title="Home">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
  </button>
  <span id="file-title">Book1 - Excel</span>
  <div class="win-btns">
    <button class="wb" title="Minimize">&#x2212;</button>
    <button class="wb" title="Restore">&#x25A1;</button>
    <button class="wb wclose" onclick="window.location='/'" title="Close">&#x2715;</button>
  </div>
</div>

<!-- ── Ribbon tabs ── -->
<div id="ribbon-tabs">
  <div class="file-tab" onclick="window.location='/'">File</div>
  <div class="rtab active" onclick="showTab('home')">Home</div>
  <div class="rtab" onclick="showTab('insert')">Insert</div>
  <div class="rtab" onclick="showTab('formulas')">Formulas</div>
  <div class="rtab" onclick="showTab('data')">Data</div>
  <div class="rtab" onclick="showTab('view')">View</div>
</div>

<!-- ── Ribbon body ── -->
<div id="ribbon">

  <!-- Clipboard -->
  <div class="rg">
    <div class="rg-inner">
      <button class="rb-lg" onclick="pasteData()" title="Paste (Ctrl+V)">
        <svg viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="1.5">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
          <rect x="8" y="2" width="8" height="4" rx="1"/>
        </svg>
        <span style="font-size:10px">Paste</span>
      </button>
      <div class="rg-sep" style="margin:0 2px"></div>
      <div class="rb-stack">
        <button class="rb" onclick="cutData()" title="Cut (Ctrl+X)">
          <svg viewBox="0 0 24 24" stroke="#555" stroke-width="1.5"><circle cx="6" cy="20" r="2"/><circle cx="6" cy="4" r="2"/><line x1="6" y1="6" x2="6" y2="18"/><path d="M20 4 6 18m0 0 6-6"/></svg>
          Cut
        </button>
        <button class="rb" onclick="copyData()" title="Copy (Ctrl+C)">
          <svg viewBox="0 0 24 24" stroke="#555" stroke-width="1.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
      </div>
    </div>
    <div class="rg-label">Clipboard</div>
  </div>
  <div class="rg-sep"></div>

  <!-- Font -->
  <div class="rg">
    <div class="rg-inner" style="flex-direction:column;gap:2px;align-items:flex-start">
      <div style="display:flex;gap:2px;align-items:center">
        <input class="fn-input" id="font-name" value="Calibri" list="font-list"
               onchange="applyFont(this.value)" onkeydown="if(event.key==='Enter')applyFont(this.value)">
        <input class="fn-input" id="font-size" type="number" value="11" min="1" max="409"
               onchange="applyFontSize(this.value)" onkeydown="if(event.key==='Enter')applyFontSize(this.value)">
        <button class="rb-ic" onclick="applyFontSize((parseInt(document.getElementById('font-size').value)||11)+2)" title="Increase Font Size" style="font-size:12px;font-weight:600;color:#444">A<sup style="font-size:7px">+</sup></button>
        <button class="rb-ic" onclick="applyFontSize(Math.max(1,(parseInt(document.getElementById('font-size').value)||11)-2))" title="Decrease Font Size" style="font-size:12px;font-weight:600;color:#444">A<sup style="font-size:7px">−</sup></button>
      </div>
      <div style="display:flex;gap:1px;align-items:center">
        <button class="rb-ic" id="btn-bold" onclick="toggleFmt('bold')" title="Bold (Ctrl+B)" style="font-weight:700;font-size:13px;font-family:Calibri,Arial">B</button>
        <button class="rb-ic" id="btn-italic" onclick="toggleFmt('italic')" title="Italic (Ctrl+I)" style="font-style:italic;font-size:13px;font-family:Cambria,Georgia,serif">I</button>
        <button class="rb-ic" id="btn-underline" onclick="toggleFmt('underline')" title="Underline (Ctrl+U)" style="text-decoration:underline;font-size:13px">U</button>
        <button class="rb-ic" id="btn-strike" onclick="toggleFmt('strike')" title="Strikethrough" style="text-decoration:line-through;font-size:12px">S</button>
        <div style="width:1px;height:16px;background:#d1d1d1;margin:0 2px"></div>
        <button class="rb-clr" id="btn-fgcolor" onclick="openColorPicker('fg',this)" title="Font Color">
          <svg viewBox="0 0 18 18" width="18" height="18"><text x="2" y="14" font-size="13" font-weight="bold" fill="#333" font-family="Arial">A</text></svg>
          <div class="clr-stripe" id="fg-stripe" style="background:#FF0000"></div>
        </button>
        <button class="rb-clr" id="btn-bgcolor" onclick="openColorPicker('bg',this)" title="Highlight Color">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.5"><path d="M3 13 9 3l6 10H3z"/><path d="M15 13c0 1.1-.9 2-2 2s-2-.9-2-2 2-3 2-3 2 1.9 2 3z" fill="#FFC000" stroke="none"/></svg>
          <div class="clr-stripe" id="bg-stripe" style="background:#FFC000"></div>
        </button>
      </div>
    </div>
    <div class="rg-label">Font</div>
  </div>
  <div class="rg-sep"></div>

  <!-- Alignment -->
  <div class="rg">
    <div class="rg-inner" style="flex-direction:column;gap:2px;align-items:flex-start">
      <div style="display:flex;gap:1px">
        <!-- top/mid/bot align -->
        <button class="rb-ic" id="btn-vtop" onclick="setVAlign('top')" title="Top Align">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.4"><line x1="2" y1="3" x2="16" y2="3"/><rect x="4" y="5" width="3" height="9" rx="0.5"/><rect x="10" y="5" width="4" height="7" rx="0.5"/></svg>
        </button>
        <button class="rb-ic" id="btn-vmid" onclick="setVAlign('middle')" title="Middle Align">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.4"><line x1="2" y1="9" x2="16" y2="9"/><rect x="4" y="4" width="3" height="10" rx="0.5"/><rect x="10" y="5" width="4" height="8" rx="0.5"/></svg>
        </button>
        <button class="rb-ic" id="btn-vbot" onclick="setVAlign('bottom')" title="Bottom Align">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.4"><line x1="2" y1="15" x2="16" y2="15"/><rect x="4" y="4" width="3" height="9" rx="0.5"/><rect x="10" y="6" width="4" height="7" rx="0.5"/></svg>
        </button>
        <div style="width:1px;height:16px;background:#d1d1d1;margin:0 2px"></div>
        <button class="rb-ic" id="btn-wrap" onclick="toggleFmt('wrap')" title="Wrap Text">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.4"><line x1="2" y1="5" x2="16" y2="5"/><path d="M2 9h10a3 3 0 0 1 0 6H9"/><polyline points="7 12 9 15 7 18" transform="rotate(-90,9,14.5) translate(-1,-1)"/><line x1="2" y1="13" x2="16" y2="13"/></svg>
        </button>
      </div>
      <div style="display:flex;gap:1px">
        <button class="rb-ic" id="btn-aleft" onclick="setHAlign('left')" title="Align Left">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.4"><line x1="2" y1="4" x2="16" y2="4"/><line x1="2" y1="7" x2="12" y2="7"/><line x1="2" y1="10" x2="16" y2="10"/><line x1="2" y1="13" x2="10" y2="13"/></svg>
        </button>
        <button class="rb-ic" id="btn-actr" onclick="setHAlign('center')" title="Center">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.4"><line x1="2" y1="4" x2="16" y2="4"/><line x1="5" y1="7" x2="13" y2="7"/><line x1="2" y1="10" x2="16" y2="10"/><line x1="4" y1="13" x2="14" y2="13"/></svg>
        </button>
        <button class="rb-ic" id="btn-argt" onclick="setHAlign('right')" title="Align Right">
          <svg viewBox="0 0 18 18" width="18" height="18" fill="none" stroke="#555" stroke-width="1.4"><line x1="2" y1="4" x2="16" y2="4"/><line x1="6" y1="7" x2="16" y2="7"/><line x1="2" y1="10" x2="16" y2="10"/><line x1="8" y1="13" x2="16" y2="13"/></svg>
        </button>
        <div style="width:1px;height:16px;background:#d1d1d1;margin:0 2px"></div>
        <button class="rb" onclick="insertRow()" title="Insert Row" style="padding:0 5px">+R</button>
        <button class="rb" onclick="deleteRow()" title="Delete Row" style="padding:0 5px">−R</button>
        <button class="rb" onclick="insertCol()" title="Insert Column" style="padding:0 5px">+C</button>
        <button class="rb" onclick="deleteCol()" title="Delete Column" style="padding:0 5px">−C</button>
      </div>
    </div>
    <div class="rg-label">Alignment &amp; Cells</div>
  </div>
  <div class="rg-sep"></div>

  <!-- Number -->
  <div class="rg">
    <div class="rg-inner" style="flex-direction:column;gap:2px;align-items:flex-start">
      <select id="num-fmt" onchange="applyNumFmt(this.value)">
        <option value="general">General</option>
        <option value="number">Number</option>
        <option value="currency">Currency</option>
        <option value="percent">Percentage</option>
        <option value="comma">Comma</option>
        <option value="date">Short Date</option>
        <option value="time">Time</option>
        <option value="text">Text</option>
      </select>
      <div style="display:flex;gap:1px">
        <button class="rb-ic" onclick="applyNumFmt('currency')" title="Accounting Number Format" style="font-size:12px;font-weight:600">$</button>
        <button class="rb-ic" onclick="applyNumFmt('percent')" title="Percent Style" style="font-size:12px">%</button>
        <button class="rb-ic" onclick="applyNumFmt('comma')" title="Comma Style" style="font-size:12px">,</button>
        <div style="width:1px;height:16px;background:#d1d1d1;margin:0 2px"></div>
        <button class="rb-ic" onclick="decimalInc(1)" title="Increase Decimal Places" style="font-size:10px">.0↑</button>
        <button class="rb-ic" onclick="decimalInc(-1)" title="Decrease Decimal Places" style="font-size:10px">.0↓</button>
      </div>
    </div>
    <div class="rg-label">Number</div>
  </div>
  <div class="rg-sep"></div>

<script>
const ROW_H=20,COL_W=64,HDR_H=20,HDR_W=40,MAX_ROWS=1048576,MAX_COLS=16384;
const COLORS=['#000000','#FFFFFF','#FF0000','#00B050','#0070C0','#FFC000','#7030A0','#FF6600','#FF6666','#FFAAAA','#FFD9D9','#FFEBEB','#66D48A','#AAEAC0','#D9F5E4','#F0FBF4','#5AABFF','#AAD4FF','#D9ECFF','#EEF6FF','#FFD966','#FFE9A3','#FFF5D5','#FFFCE6','#B866E0','#D9AAEE','#F0D9F8','#FAF0FF','#FFA366','#FFCFAA','#FFE9D9','#FFF5EE','#404040','#606060','#808080','#A0A0A0','#C0C0C0','#D8D8D8','#ECECEC','#F8F8F8'];

function defaultSheet(name){return{name,cells:new Map(),colWidths:{},rowHeights:{}};}
let sheets=[defaultSheet('Sheet1'),defaultSheet('Sheet2'),defaultSheet('Sheet3')];
let curSheet=0;
function sheet(){return sheets[curSheet];}
function getCell(r,c){return sheet().cells.get(`${r},${c}`)||null;}
function setCell(r,c,obj){if(!obj){sheet().cells.delete(`${r},${c}`);return;}sheet().cells.set(`${r},${c}`,obj);}

let undoStack=[],redoStack=[];
function snapshot(){const snap=sheets.map(s=>({name:s.name,cells:new Map(s.cells),colWidths:{...s.colWidths},rowHeights:{...s.rowHeights}}));undoStack.push({snap,curSheet,sel:{...sel}});if(undoStack.length>100)undoStack.shift();redoStack=[];}
function undo(){if(!undoStack.length)return;const cur=sheets.map(s=>({name:s.name,cells:new Map(s.cells),colWidths:{...s.colWidths},rowHeights:{...s.rowHeights}}));redoStack.push({snap:cur,curSheet,sel:{...sel}});const{snap,curSheet:cs,sel:s}=undoStack.pop();sheets=snap;curSheet=cs;Object.assign(sel,s);renderAll();}
function redo(){if(!redoStack.length)return;const cur=sheets.map(s=>({name:s.name,cells:new Map(s.cells),colWidths:{...s.colWidths},rowHeights:{...s.rowHeights}}));undoStack.push({snap:cur,curSheet,sel:{...sel}});const{snap,curSheet:cs,sel:s}=redoStack.pop();sheets=snap;curSheet=cs;Object.assign(sel,s);renderAll();}

let sel={r:0,c:0,r2:0,c2:0};
let scrollRow=0,scrollCol=0,zoom=1;
let clipboard=null,clipMode='';
let editing=false;
let colorTarget='';
let dragging=false;
let resizingCol=null,resizeStartX=0,resizeStartW=0;

const canvas=document.getElementById('grid-canvas');
const ctx=canvas.getContext('2d');
let W=0,H=0;

function resize(){const wrap=document.getElementById('grid-wrap');W=wrap.clientWidth-15;H=wrap.clientHeight;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.scale(devicePixelRatio,devicePixelRatio);updateScrollbars();draw();}
function colWidth(c){return(sheet().colWidths[c]??COL_W)*zoom;}
function rowHeight(r){return(sheet().rowHeights[r]??ROW_H)*zoom;}

function colLabel(c){let s='',n=c+1;while(n>0){s=String.fromCharCode(64+(n%26||26))+s;n=Math.floor((n-1)/26);}return s;}
function cellLabel(r,c){return colLabel(c)+(r+1);}
function colFromLabel(s){s=s.toUpperCase();let v=0;for(let i=0;i<s.length;i++)v=v*26+s.charCodeAt(i)-64;return v-1;}
function parseRef(ref){const m=ref.match(/^([A-Z]+)(\d+)$/i);if(!m)return null;return[parseInt(m[2])-1,colFromLabel(m[1])];}

function xToCol(x){let px=HDR_W;for(let c=scrollCol;c<MAX_COLS;c++){const w=colWidth(c);if(x<px+w)return{col:c,x0:px};px+=w;if(px>W)break;}return null;}
function yToRow(y){let py=HDR_H;for(let r=scrollRow;r<MAX_ROWS;r++){const h=rowHeight(r);if(y<py+h)return{row:r,y0:py};py+=h;if(py>H)break;}return null;}
function cellXY(r,c){let px=HDR_W,py=HDR_H;for(let i=scrollCol;i<c;i++)px+=colWidth(i);for(let i=scrollRow;i<r;i++)py+=rowHeight(i);return{x:px,y:py};}

function draw(){
  ctx.clearRect(0,0,W,H);
  const minR=Math.min(sel.r,sel.r2),maxR=Math.max(sel.r,sel.r2);
  const minC=Math.min(sel.c,sel.c2),maxC=Math.max(sel.c,sel.c2);
  let cols=[],rows=[],px=HDR_W,py=HDR_H;
  for(let c=scrollCol;c<MAX_COLS&&px<W;c++){cols.push({c,x:px});px+=colWidth(c);}
  for(let r=scrollRow;r<MAX_ROWS&&py<H;r++){rows.push({r,y:py});py+=rowHeight(r);}

  for(const{r,y}of rows){const rh=rowHeight(r);for(const{c,x}of cols){
    const cw=colWidth(c),cell=getCell(r,c);
    const inSel=r>=minR&&r<=maxR&&c>=minC&&c<=maxC;
    let bg=cell?.fmt?.bg||'#fff';
    if(inSel)bg=(r===sel.r&&c===sel.c)?'#fff':'#cce0ff';
    ctx.fillStyle=bg;ctx.fillRect(x,y,cw,rh);
    ctx.strokeStyle='#d0d0d0';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x+cw-.5,y);ctx.lineTo(x+cw-.5,y+rh);ctx.moveTo(x,y+rh-.5);ctx.lineTo(x+cw,y+rh-.5);ctx.stroke();
    if(!cell)continue;
    const val=cell.formula?evalFormula(cell.formula,r,c):cell.raw;
    const disp=formatValue(val,cell.fmt?.numFmt||'general',cell.fmt?.decimals);
    if(disp===null||disp===undefined||disp==='')continue;
    ctx.save();ctx.rect(x+1,y+1,cw-2,rh-2);ctx.clip();
    const fg=cell.fmt?.fg||'#000';
    let fstyle='';if(cell.fmt?.bold)fstyle+='bold ';if(cell.fmt?.italic)fstyle+='italic ';
    const fsize=(cell.fmt?.fontSize||11)*zoom;
    ctx.font=`${fstyle}${fsize}px ${cell.fmt?.fontName||'Calibri'},Arial,sans-serif`;
    ctx.fillStyle=fg;
    const halign=cell.fmt?.halign||(typeof val==='number'?'right':'left');
    ctx.textAlign=halign==='right'?'right':halign==='center'?'center':'left';
    const tx=halign==='right'?x+cw-3:halign==='center'?x+cw/2:x+3;
    const textY=y+rh/2+fsize*0.36;
    ctx.fillText(String(disp),tx,textY);
    const tw=ctx.measureText(String(disp)).width;
    const lx=halign==='right'?x+cw-3-tw:halign==='center'?x+cw/2-tw/2:x+3;
    if(cell.fmt?.underline){ctx.strokeStyle=fg;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lx,textY+2);ctx.lineTo(lx+tw,textY+2);ctx.stroke();}
    if(cell.fmt?.strike){ctx.strokeStyle=fg;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(lx,textY-fsize*.2);ctx.lineTo(lx+tw,textY-fsize*.2);ctx.stroke();}
    ctx.restore();
  }}

  // selection border
  if(!editing||dragging){
    const{x:sx,y:sy}=cellXY(minR,minC);
    let sw=0,sh=0;
    for(let c=minC;c<=maxC;c++)sw+=colWidth(c);
    for(let r=minR;r<=maxR;r++)sh+=rowHeight(r);
    ctx.strokeStyle='#107C41';ctx.lineWidth=2;
    ctx.strokeRect(sx+1,sy+1,sw-2,sh-2);
    ctx.fillStyle='#107C41';
    const{x:ex,y:ey}=cellXY(maxR,maxC);
    ctx.fillRect(ex+colWidth(maxC)-3,ey+rowHeight(maxR)-3,5,5);
  }

  // col headers
  ctx.fillStyle='#f2f2f2';ctx.fillRect(HDR_W,0,W,HDR_H);
  for(const{c,x}of cols){
    const cw=colWidth(c),inSel=c>=minC&&c<=maxC;
    if(inSel){ctx.fillStyle='#b8d8f0';ctx.fillRect(x,0,cw,HDR_H);}
    ctx.strokeStyle='#d0d0d0';ctx.lineWidth=1;
    ctx.strokeRect(x+.5,.5,cw-1,HDR_H-1);
    ctx.fillStyle=inSel?'#107C41':'#444';
    ctx.font=`bold ${Math.round(10.5*zoom)}px Calibri,Arial,sans-serif`;
    ctx.textAlign='center';ctx.fillText(colLabel(c),x+cw/2,13*zoom);
  }

  // row headers
  ctx.fillStyle='#f2f2f2';ctx.fillRect(0,HDR_H,HDR_W,H);
  for(const{r,y}of rows){
    const rh=rowHeight(r),inSel=r>=minR&&r<=maxR;
    if(inSel){ctx.fillStyle='#b8d8f0';ctx.fillRect(0,y,HDR_W,rh);}
    ctx.strokeStyle='#d0d0d0';ctx.lineWidth=1;
    ctx.strokeRect(.5,y+.5,HDR_W-1,rh-1);
    ctx.fillStyle=inSel?'#107C41':'#444';
    ctx.font=`${Math.round(10.5*zoom)}px Calibri,Arial,sans-serif`;
    ctx.textAlign='center';ctx.fillText(String(r+1),HDR_W/2,y+rh/2+4*zoom);
  }

  // corner
  ctx.fillStyle='#f2f2f2';ctx.fillRect(0,0,HDR_W,HDR_H);
  ctx.strokeStyle='#d0d0d0';ctx.lineWidth=1;ctx.strokeRect(.5,.5,HDR_W-1,HDR_H-1);

  // clipboard dashes
  if(clipboard&&clipMode==='copy'){
    const{r:cr,c:cc,r2:cr2,c2:cc2}=clipboard.sel;
    const{x:clipX,y:clipY}=cellXY(Math.min(cr,cr2),Math.min(cc,cc2));
    let cw2=0,ch2=0;
    for(let c=Math.min(cc,cc2);c<=Math.max(cc,cc2);c++)cw2+=colWidth(c);
    for(let r=Math.min(cr,cr2);r<=Math.max(cr,cr2);r++)ch2+=rowHeight(r);
    ctx.strokeStyle='#107C41';ctx.lineWidth=1.5;ctx.setLineDash([4,4]);
    ctx.strokeRect(clipX+1,clipY+1,cw2-2,ch2-2);ctx.setLineDash([]);
  }
}

// ── Formula engine ──
const FUNCS={
  SUM:(...a)=>flatNums(a).reduce((s,v)=>s+v,0),
  AVERAGE:(...a)=>{const n=flatNums(a);return n.length?n.reduce((s,v)=>s+v,0)/n.length:0},
  COUNT:(...a)=>flatNums(a).length,
  COUNTA:(...a)=>flatAll(a).filter(v=>v!==''&&v!==null&&v!==undefined).length,
  MIN:(...a)=>Math.min(...flatNums(a)),
  MAX:(...a)=>Math.max(...flatNums(a)),
  IF:(c,t,f='')=>c?t:f,
  AND:(...a)=>a.every(Boolean),OR:(...a)=>a.some(Boolean),NOT:v=>!v,
  ROUND:(v,d=0)=>parseFloat(v.toFixed(d)),
  ROUNDUP:(v,d=0)=>Math.ceil(v*10**d)/10**d,
  ROUNDDOWN:(v,d=0)=>Math.floor(v*10**d)/10**d,
  ABS:v=>Math.abs(v),SQRT:v=>Math.sqrt(v),POWER:(b,e)=>b**e,MOD:(a,b)=>a%b,INT:v=>Math.floor(v),
  LEN:v=>String(v??'').length,UPPER:v=>String(v??'').toUpperCase(),LOWER:v=>String(v??'').toLowerCase(),
  TRIM:v=>String(v??'').trim(),LEFT:(v,n=1)=>String(v??'').slice(0,n),RIGHT:(v,n=1)=>String(v??'').slice(-n),
  MID:(v,s,n)=>String(v??'').slice(s-1,s-1+n),
  CONCATENATE:(...a)=>a.map(v=>v??'').join(''),CONCAT:(...a)=>a.map(v=>v??'').join(''),
  TODAY:()=>{const d=new Date();return dateSerial(d.getFullYear(),d.getMonth()+1,d.getDate());},
  NOW:()=>{const d=new Date();return dateSerial(d.getFullYear(),d.getMonth()+1,d.getDate())+d.getHours()/24+d.getMinutes()/1440;},
  YEAR:v=>excelDateToDate(v).getFullYear(),MONTH:v=>excelDateToDate(v).getMonth()+1,DAY:v=>excelDateToDate(v).getDate(),
  DATE:(y,m,d)=>dateSerial(y,m,d),
  IFERROR:(v,e)=>v instanceof Error?e:v,
  ISBLANK:v=>v===''||v===null||v===undefined,ISNUMBER:v=>typeof v==='number',ISTEXT:v=>typeof v==='string',
  VLOOKUP:(val,range,ci,exact)=>{if(!Array.isArray(range))return'#N/A';for(const row of range){const m=exact===false?(typeof row[0]==='number'&&row[0]<=val):row[0]==val;if(m)return row[ci-1]??'#N/A';}return'#N/A';},
};
function dateSerial(y,m,d){return Math.floor((new Date(y,m-1,d)-new Date(1899,11,30))/86400000);}
function excelDateToDate(n){return new Date(new Date(1899,11,30).getTime()+n*86400000);}
function flatNums(a){return flatAll(a).map(v=>Number(v)).filter(v=>!isNaN(v));}
function flatAll(a){const r=[];for(const v of a){if(Array.isArray(v))v.forEach(row=>Array.isArray(row)?r.push(...row):r.push(row));else r.push(v);}return r;}

function evalFormula(formula,hr,hc){if(!formula||formula[0]!=='=')return formula;try{return evaluate(formula.slice(1),hr,hc);}catch(e){return'#ERR';}}

function evaluate(expr,hr,hc){
  const tokens=tokenize(expr);let pos=0;
  const peek=()=>tokens[pos],consume=()=>tokens[pos++];
  function parseExpr(){return parseComp();}
  function parseComp(){let l=parseAS();while(peek()&&['=','<>','<=','>=','<','>'].includes(peek().val)){const op=consume().val,r=parseAS();l=op==='='?l==r:op==='<>'?l!=r:op==='<='?l<=r:op==='>='?l>=r:op==='<'?l<r:l>r;}return l;}
  function parseAS(){let l=parseMD();while(peek()&&['+','-'].includes(peek().val)&&peek().type==='op'){const op=consume().val,r=parseMD();l=op==='+'?(+l||0)+(+r||0):(+l||0)-(+r||0);}return l;}
  function parseMD(){let l=parseU();while(peek()&&['*','/','%','&'].includes(peek().val)){const op=consume().val,r=parseU();l=op==='*'?(+l||0)*(+r||0):op==='/'?(+r||0)?((+l||0)/(+r||0)):'#DIV/0!':op==='%'?(+l||0)%(+r||0):String(l??'')+String(r??'');}return l;}
  function parseU(){if(peek()&&peek().val==='-'&&peek().type==='op'){consume();return-(+parsePow()||0);}if(peek()&&peek().val==='+'&&peek().type==='op'){consume();return+parsePow()||0;}return parsePow();}
  function parsePow(){let l=parseAtom();if(peek()&&peek().val==='^'){consume();l=(+l||0)**(+parseAtom()||0);}return l;}
  function parseAtom(){
    const t=peek();if(!t)return'';
    if(t.type==='num'){consume();return+t.val;}
    if(t.type==='str'){consume();return t.val;}
    if(t.type==='bool'){consume();return t.val==='TRUE';}
    if(t.type==='paren'&&t.val==='('){consume();const v=parseExpr();if(peek()&&peek().val===')')consume();return v;}
    if(t.type==='func'){const name=t.val.toUpperCase();consume();consume();const args=[];while(peek()&&peek().val!==')'){if(peek().val===','){consume();continue;}args.push(parseExpr());}if(peek())consume();const fn=FUNCS[name];if(!fn)return'#NAME?';try{return fn(...args);}catch(e){return'#ERR';}}
    if(t.type==='range'){consume();return resolveRange(t.val,hr,hc);}
    if(t.type==='ref'){consume();return resolveCellRef(t.val,hr,hc);}
    consume();return'';
  }
  return parseExpr();
}

function tokenize(expr){
  const tokens=[];let i=0;
  while(i<expr.length){
    if(expr[i]===' '){i++;continue;}
    if(expr[i]==='"'){let s='',j=i+1;while(j<expr.length&&expr[j]!=='"')s+=expr[j++];tokens.push({type:'str',val:s});i=j+1;continue;}
    if(/[0-9.]/.test(expr[i])){let s='';while(i<expr.length&&/[0-9.eE+\-]/.test(expr[i]))s+=expr[i++];tokens.push({type:'num',val:s});continue;}
    if(/[A-Za-z_]/.test(expr[i])){
      let s='';while(i<expr.length&&/[A-Za-z0-9_$]/.test(expr[i]))s+=expr[i++];
      if(s.toUpperCase()==='TRUE'||s.toUpperCase()==='FALSE'){tokens.push({type:'bool',val:s.toUpperCase()});continue;}
      let j=i;while(j<expr.length&&expr[j]===' ')j++;
      if(expr[j]==='('){tokens.push({type:'func',val:s});i=j;continue;}
      if(expr[i]===':'){let s2='';let k=i+1;while(k<expr.length&&/[A-Za-z0-9$]/.test(expr[k]))s2+=expr[k++];tokens.push({type:'range',val:s+':'+s2});i=k;continue;}
      tokens.push({type:/^[A-Z]+\d+$/i.test(s)?'ref':'name',val:s});continue;
    }
    const two=expr.slice(i,i+2);
    if(['<>','<=','>='].includes(two)){tokens.push({type:'op',val:two});i+=2;continue;}
    tokens.push({type:'([,'.includes(expr[i])?'paren':'op',val:expr[i]});i++;
  }
  return tokens;
}

function resolveCellRef(ref,hr,hc){const p=parseRef(ref);if(!p)return 0;const[r,c]=p,cell=getCell(r,c);if(!cell)return 0;const v=cell.formula?evalFormula(cell.formula,r,c):cell.raw;return v===''||v===null||v===undefined?0:v;}
function resolveRange(rs,hr,hc){const[a,b]=rs.split(':'),p1=parseRef(a),p2=parseRef(b);if(!p1||!p2)return 0;const[r1,c1]=p1,[r2,c2]=p2,result=[];for(let r=r1;r<=r2;r++){const row=[];for(let c=c1;c<=c2;c++){const cell=getCell(r,c),v=cell?(cell.formula?evalFormula(cell.formula,r,c):cell.raw):0;row.push(v===''||v===null||v===undefined?0:v);}result.push(row);}return result;}

function formatValue(v,fmt,decimals){
  if(v===null||v===undefined||v==='')return'';
  if(typeof v==='string'&&!['general','number','currency','percent','comma'].includes(fmt))return v;
  const n=Number(v),d=decimals??2;
  if(fmt==='general')return String(v);
  if(fmt==='number')return isNaN(n)?v:n.toFixed(d);
  if(fmt==='currency')return isNaN(n)?v:'$'+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  if(fmt==='percent')return isNaN(n)?v:(n*100).toFixed(d)+'%';
  if(fmt==='comma')return isNaN(n)?v:n.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  if(fmt==='date')return isNaN(n)?v:excelDateToDate(n).toLocaleDateString();
  if(fmt==='time')return isNaN(n)?v:excelDateToDate(n).toLocaleTimeString();
  if(fmt==='text')return String(v);
  return String(v);
}

// ── Scrollbars ──
function updateScrollbars(){
  document.getElementById('hscroll-inner').style.width=(HDR_W+MAX_COLS*COL_W*zoom)+'px';
  document.getElementById('vscroll-inner').style.height=(HDR_H+MAX_ROWS*ROW_H*zoom)+'px';
  document.getElementById('hscroll').scrollLeft=scrollCol*COL_W*zoom;
  document.getElementById('vscroll').scrollTop=scrollRow*ROW_H*zoom;
}
document.getElementById('hscroll').addEventListener('scroll',e=>{scrollCol=Math.floor(e.target.scrollLeft/(COL_W*zoom));draw();});
document.getElementById('vscroll').addEventListener('scroll',e=>{scrollRow=Math.floor(e.target.scrollTop/(ROW_H*zoom));draw();});

// ── Mouse ──
canvas.addEventListener('mousedown',e=>{
  closeContextMenu();
  const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(y<HDR_H&&x>HDR_W){const res=findColResize(x);if(res!==null){resizingCol=res;resizeStartX=e.clientX;resizeStartW=sheet().colWidths[res]??COL_W;canvas.style.cursor='col-resize';return;}}
  if(y<HDR_H&&x>HDR_W){const col=xToCol(x);if(col){snapshot();sel={r:0,c:col.col,r2:MAX_ROWS-1,c2:col.col};renderAll();}return;}
  if(x<HDR_W&&y>HDR_H){const row=yToRow(y);if(row){snapshot();sel={r:row.row,c:0,r2:row.row,c2:MAX_COLS-1};renderAll();}return;}
  if(editing)commitEdit();
  const col=xToCol(x),row=yToRow(y);if(!col||!row)return;
  sel.r=row.row;sel.c=col.col;
  if(e.shiftKey){sel.r2=row.row;sel.c2=col.col;}else{sel.r2=row.row;sel.c2=col.col;}
  dragging=true;renderAll();
});
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
  if(resizingCol!==null){sheet().colWidths[resizingCol]=Math.max(8,resizeStartW+(e.clientX-resizeStartX)/zoom);updateScrollbars();draw();return;}
  if(dragging){const col=xToCol(x),row=yToRow(y);if(col&&row){sel.r2=row.row;sel.c2=col.col;draw();}return;}
  canvas.style.cursor=(y<HDR_H&&x>HDR_W&&findColResize(x)!==null)?'col-resize':'cell';
});
canvas.addEventListener('mouseup',()=>{dragging=false;if(resizingCol!==null){resizingCol=null;canvas.style.cursor='cell';updateScrollbars();draw();}});
canvas.addEventListener('dblclick',e=>{const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;if(x<HDR_W||y<HDR_H)return;startEdit();});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;const col=xToCol(x),row=yToRow(y);if(col&&row){sel.r=row.row;sel.c=col.col;sel.r2=row.row;sel.c2=col.col;}showContextMenu(e.clientX,e.clientY);});
function findColResize(x){let px=HDR_W;for(let c=scrollCol;c<MAX_COLS&&px<W;c++){const w=colWidth(c);if(Math.abs(x-(px+w))<4)return c;px+=w;}return null;}

// ── Keyboard ──
document.addEventListener('keydown',e=>{
  const ae=document.activeElement;
  if(ae===document.getElementById('formula-input')||ae===document.getElementById('name-box')||ae===document.getElementById('font-name')||ae===document.getElementById('font-size'))return;
  const{key,ctrlKey,shiftKey}=e;
  if(ctrlKey){
    if(key==='z'){e.preventDefault();undo();return;}if(key==='y'){e.preventDefault();redo();return;}
    if(key==='c'){e.preventDefault();copyData();return;}if(key==='x'){e.preventDefault();cutData();return;}
    if(key==='v'){e.preventDefault();pasteData();return;}if(key==='a'){e.preventDefault();sel={r:0,c:0,r2:MAX_ROWS-1,c2:MAX_COLS-1};renderAll();return;}
    if(key==='b'){e.preventDefault();toggleFmt('bold');return;}if(key==='i'){e.preventDefault();toggleFmt('italic');return;}
    if(key==='u'){e.preventDefault();toggleFmt('underline');return;}if(key==='s'){e.preventDefault();saveToLocal();return;}
    if(key==='Home'){e.preventDefault();sel.r=0;sel.c=0;if(!shiftKey){sel.r2=0;sel.c2=0;}ensureVisible();renderAll();return;}
    if(key==='End'){e.preventDefault();let mr=0,mc=0;for(const[k]of sheet().cells){const[r,c]=k.split(',').map(Number);if(r>mr)mr=r;if(c>mc)mc=c;}sel.r=mr;sel.c=mc;if(!shiftKey){sel.r2=mr;sel.c2=mc;}ensureVisible();renderAll();return;}
  }
  if(editing){if(key==='Enter'){commitEdit();moveActive(1,0,shiftKey);}else if(key==='Tab'){e.preventDefault();commitEdit();moveActive(0,1,shiftKey);}else if(key==='Escape')cancelEdit();return;}
  const moves={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(moves[key]){e.preventDefault();const[dr,dc]=moves[key];if(shiftKey){sel.r2=Math.max(0,Math.min(MAX_ROWS-1,sel.r2+dr));sel.c2=Math.max(0,Math.min(MAX_COLS-1,sel.c2+dc));}else{sel.r=Math.max(0,Math.min(MAX_ROWS-1,sel.r+dr));sel.c=Math.max(0,Math.min(MAX_COLS-1,sel.c+dc));sel.r2=sel.r;sel.c2=sel.c;}ensureVisible();renderAll();return;}
  if(key==='Enter'){moveActive(1,0,shiftKey);return;}if(key==='Tab'){e.preventDefault();moveActive(0,1,shiftKey);return;}
  if(key==='Delete'||key==='Backspace'){snapshot();clearSelection();return;}
  if(key==='F2'){startEdit();return;}
  if(key==='PageDown'){const v=Math.floor((H-HDR_H)/ROW_H);sel.r+=v;sel.r2=sel.r;sel.c2=sel.c;ensureVisible();renderAll();return;}
  if(key==='PageUp'){const v=Math.floor((H-HDR_H)/ROW_H);sel.r=Math.max(0,sel.r-v);sel.r2=sel.r;sel.c2=sel.c;ensureVisible();renderAll();return;}
  if(key==='Home'){sel.c=0;sel.c2=0;ensureVisible();renderAll();return;}
  if(key.length===1&&!ctrlKey)startEdit(key);
});

function moveActive(dr,dc,shift){
  if(shift){sel.r2=Math.max(0,Math.min(MAX_ROWS-1,sel.r2+dr));sel.c2=Math.max(0,Math.min(MAX_COLS-1,sel.c2+dc));}
  else{sel.r=Math.max(0,Math.min(MAX_ROWS-1,sel.r+dr));sel.c=Math.max(0,Math.min(MAX_COLS-1,sel.c+dc));sel.r2=sel.r;sel.c2=sel.c;}
  ensureVisible();renderAll();
}
function ensureVisible(){
  const r=sel.r,c=sel.c;
  if(r<scrollRow)scrollRow=r;else{let py=HDR_H;for(let i=scrollRow;i<r;i++)py+=rowHeight(i);py+=rowHeight(r);if(py>H){let sum=0;for(let i=r;sum<H-HDR_H;i--){sum+=rowHeight(i);scrollRow=i;}}}
  if(c<scrollCol)scrollCol=c;else{let px=HDR_W;for(let i=scrollCol;i<c;i++)px+=colWidth(i);px+=colWidth(c);if(px>W){let sum=0;for(let i=c;sum<W-HDR_W;i--){sum+=colWidth(i);scrollCol=i;}}}
  updateScrollbars();
}

// ── Inline edit ──
let editInput=null;
function startEdit(initial){
  if(editing)return;editing=true;
  const cell=getCell(sel.r,sel.c),{x,y}=cellXY(sel.r,sel.c),cw=colWidth(sel.c),rh=rowHeight(sel.r);
  editInput=document.createElement('input');editInput.type='text';
  editInput.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:${cw}px;height:${rh}px;border:2px solid #107C41;outline:none;padding:0 2px;font:${11*zoom}px Calibri,Arial,sans-serif;z-index:100;background:#fff`;
  editInput.value=initial!==undefined?initial:(cell?.formula||cell?.raw||'');
  document.getElementById('grid-wrap').appendChild(editInput);editInput.focus();
  if(initial===undefined)editInput.select();
  document.getElementById('formula-input').value=editInput.value;
  editInput.addEventListener('input',()=>document.getElementById('formula-input').value=editInput.value);
  editInput.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();commitEdit();moveActive(1,0,e.shiftKey);}
    else if(e.key==='Tab'){e.preventDefault();commitEdit();moveActive(0,1,e.shiftKey);}
    else if(e.key==='Escape')cancelEdit();
    else if((e.key==='ArrowUp'||e.key==='ArrowDown')&&!editInput.value.startsWith('=')){e.preventDefault();commitEdit();moveActive(e.key==='ArrowUp'?-1:1,0);}
  });
}
function commitEdit(){
  if(!editing||!editInput)return;editing=false;
  const val=editInput.value;editInput.remove();editInput=null;
  snapshot();const existing=getCell(sel.r,sel.c)||{};
  if(val===''){const{formula:_f,raw:_r,...rest}=existing;Object.keys(rest).length?setCell(sel.r,sel.c,rest):setCell(sel.r,sel.c,null);}
  else if(val.startsWith('=')){setCell(sel.r,sel.c,{...existing,formula:val,raw:''});}
  else{const n=Number(val);setCell(sel.r,sel.c,{...existing,formula:undefined,raw:isNaN(n)?val:n});}
  renderAll();
}
function cancelEdit(){if(!editing||!editInput)return;editing=false;editInput.remove();editInput=null;draw();}
function formulaBarInput(v){if(editInput)editInput.value=v;else{startEdit(v);if(editInput)editInput.value=v;}}
function formulaBarKeydown(e){if(e.key==='Enter'){commitEdit();moveActive(1,0);canvas.focus();}if(e.key==='Escape'){cancelEdit();canvas.focus();}}
function formulaBarBlur(){}

// ── Selection ops ──
function clearSelection(){
  const r1=Math.min(sel.r,sel.r2),r2=Math.max(sel.r,sel.r2),c1=Math.min(sel.c,sel.c2),c2=Math.max(sel.c,sel.c2);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){const cell=getCell(r,c);if(cell){const{raw:_,formula:__,...rest}=cell;Object.keys(rest).length?setCell(r,c,{...rest,raw:''}):setCell(r,c,null);}}
  renderAll();
}
function copyData(){
  const r1=Math.min(sel.r,sel.r2),r2=Math.max(sel.r,sel.r2),c1=Math.min(sel.c,sel.c2),c2=Math.max(sel.c,sel.c2),data=[];
  for(let r=r1;r<=r2;r++){const row=[];for(let c=c1;c<=c2;c++)row.push({...getCell(r,c)});data.push(row);}
  clipboard={sel:{r:r1,c:c1,r2,c2},data};clipMode='copy';draw();
  const text=data.map(row=>row.map(cell=>{const v=cell?.formula||cell?.raw||'';return String(v);}).join('\t')).join('\n');
  navigator.clipboard?.writeText(text);
}
function cutData(){copyData();clipMode='cut';clearSelection();}
function pasteData(){
  if(!clipboard)return;snapshot();
  const{r:sr,c:sc,data}=clipboard;
  for(let dr=0;dr<data.length;dr++)for(let dc=0;dc<data[0].length;dc++){const src=data[dr][dc];src?setCell(sel.r+dr,sel.c+dc,{...src}):setCell(sel.r+dr,sel.c+dc,null);}
  if(clipMode==='cut')clipboard=null;
  renderAll();
}

// ── Formatting ──
function selCells(fn){
  snapshot();
  const r1=Math.min(sel.r,sel.r2),r2=Math.max(sel.r,sel.r2),c1=Math.min(sel.c,sel.c2),c2=Math.max(sel.c,sel.c2);
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){const cell=getCell(r,c)||{};const updated=fn({...cell});setCell(r,c,Object.keys(updated).length?updated:null);}
  updateToolbarState();draw();
}
function toggleFmt(prop){const cell=getCell(sel.r,sel.c),cur=cell?.fmt?.[prop];selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt[prop]=!cur;return cell;});}
function applyFont(name){selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.fontName=name;return cell;});}
function applyFontSize(size){selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.fontSize=parseInt(size)||11;return cell;});}
function setHAlign(a){selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.halign=a;return cell;});}
function setVAlign(a){selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.valign=a;return cell;});}
function applyNumFmt(fmt){selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.numFmt=fmt;return cell;});document.getElementById('num-fmt').value=fmt;}
function decimalInc(d){selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.decimals=Math.max(0,(cell.fmt.decimals||0)+d);return cell;});}
function applyColor(target,color){
  if(target==='fg'){selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.fg=color;return cell;});document.getElementById('fg-stripe').style.background=color;}
  else{selCells(cell=>{cell.fmt=cell.fmt||{};cell.fmt.bg=color;return cell;});document.getElementById('bg-stripe').style.background=color;}
}

// ── Toolbar state ──
function updateToolbarState(){
  const cell=getCell(sel.r,sel.c),fmt=cell?.fmt||{};
  document.getElementById('btn-bold').classList.toggle('active',!!fmt.bold);
  document.getElementById('btn-italic').classList.toggle('active',!!fmt.italic);
  document.getElementById('btn-underline').classList.toggle('active',!!fmt.underline);
  document.getElementById('btn-strike').classList.toggle('active',!!fmt.strike);
  document.getElementById('btn-wrap').classList.toggle('active',!!fmt.wrap);
  document.getElementById('btn-aleft').classList.toggle('active',fmt.halign==='left');
  document.getElementById('btn-actr').classList.toggle('active',fmt.halign==='center');
  document.getElementById('btn-argt').classList.toggle('active',fmt.halign==='right');
  document.getElementById('font-name').value=fmt.fontName||'Calibri';
  document.getElementById('font-size').value=fmt.fontSize||11;
  document.getElementById('num-fmt').value=fmt.numFmt||'general';

  document.getElementById('name-box').value=cellLabel(sel.r,sel.c);
}
function updateStatusBar(){
  const r1=Math.min(sel.r,sel.r2),r2=Math.max(sel.r,sel.r2),c1=Math.min(sel.c,sel.c2),c2=Math.max(sel.c,sel.c2),vals=[];
  for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++){const cell=getCell(r,c);if(!cell)continue;const v=cell.formula?evalFormula(cell.formula,r,c):cell.raw;if(v!==''&&v!==null&&v!==undefined)vals.push(v);}
  const nums=vals.map(Number).filter(v=>!isNaN(v));
  const sum=nums.reduce((s,v)=>s+v,0);
  document.getElementById('stat-sum').textContent=nums.length?`Sum: ${sum.toFixed(2)}`:'';
  document.getElementById('stat-avg').textContent=nums.length?`Average: ${(sum/nums.length).toFixed(2)}`:'';
  document.getElementById('stat-cnt').textContent=vals.length?`Count: ${vals.length}`:'';
}
function renderAll(){draw();updateToolbarState();updateStatusBar();renderTabs();}

// ── Insert/Delete ──
function insertRow(){snapshot();const r=sel.r,nc=new Map();for(const[k,v]of sheet().cells){const[cr,cc]=k.split(',').map(Number);nc.set(cr>=r?`${cr+1},${cc}`:k,v);}sheet().cells=nc;draw();}
function deleteRow(){snapshot();const r=sel.r,nc=new Map();for(const[k,v]of sheet().cells){const[cr,cc]=k.split(',').map(Number);if(cr!==r)nc.set(cr>r?`${cr-1},${cc}`:k,v);}sheet().cells=nc;draw();}
function insertCol(){snapshot();const c=sel.c,nc=new Map();for(const[k,v]of sheet().cells){const[cr,cc]=k.split(',').map(Number);nc.set(cc>=c?`${cr},${cc+1}`:k,v);}sheet().cells=nc;draw();}
function deleteCol(){snapshot();const c=sel.c,nc=new Map();for(const[k,v]of sheet().cells){const[cr,cc]=k.split(',').map(Number);if(cc!==c)nc.set(cc>c?`${cr},${cc-1}`:k,v);}sheet().cells=nc;draw();}

// ── Sheets ──
function renderTabs(){
  const bar=document.getElementById('tabs-bar');
  [...bar.querySelectorAll('.sheet-tab')].forEach(t=>t.remove());
  const addBtn=document.getElementById('add-sheet');
  sheets.forEach((s,i)=>{
    const tab=document.createElement('div');
    tab.className='sheet-tab'+(i===curSheet?' active':'');
    tab.textContent=s.name;
    tab.onclick=()=>{curSheet=i;renderAll();};
    tab.ondblclick=()=>renameSheet(i,tab);
    tab.oncontextmenu=e=>{e.preventDefault();sheetCtxMenu(e,i);};
    bar.insertBefore(tab,addBtn);
  });
}
function addSheet(){sheets.push(defaultSheet(`Sheet${sheets.length+1}`));curSheet=sheets.length-1;renderAll();}
function renameSheet(i,el){const input=document.createElement('input');input.value=sheets[i].name;input.style.cssText='width:80px;font:11px Calibri;border:1px solid #217346;outline:none;padding:1px 3px';el.replaceWith(input);input.focus();input.select();const done=()=>{sheets[i].name=input.value||sheets[i].name;renderTabs();};input.onblur=done;input.onkeydown=e=>{if(e.key==='Enter')done();};}
function sheetCtxMenu(e,i){const menu=document.getElementById('ctx-menu');menu.innerHTML=`<div class="ctx-item" onclick="renameSheetPrompt(${i})">Rename</div><div class="ctx-item" onclick="deleteSheet(${i})">Delete</div>`;menu.style.display='block';menu.style.left=e.clientX+'px';menu.style.top=e.clientY+'px';}
function renameSheetPrompt(i){const name=prompt('Sheet name:',sheets[i].name);if(name)sheets[i].name=name;closeContextMenu();renderTabs();}
function deleteSheet(i){if(sheets.length===1)return;sheets.splice(i,1);curSheet=Math.min(curSheet,sheets.length-1);closeContextMenu();renderAll();}

// ── Export ──
function exportCSV(){
  let mr=0,mc=0;for(const[k]of sheet().cells){const[r,c]=k.split(',').map(Number);if(r>mr)mr=r;if(c>mc)mc=c;}
  const rows=[];
  for(let r=0;r<=mr;r++){const row=[];for(let c=0;c<=mc;c++){const cell=getCell(r,c),v=cell?(cell.formula?evalFormula(cell.formula,r,c):cell.raw):'';const s=String(v??'').replace(/"/g,'""');row.push(s.includes(',')||s.includes('"')||s.includes('\n')?`"${s}"`:s);}rows.push(row.join(','));}
  download(rows.join('\n'),`${sheet().name}.csv`,'text/csv');
}
function exportXLSX(){
  if(typeof XLSX==='undefined'){const s=document.createElement('script');s.src='https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js';s.onload=doExportXLSX;document.head.appendChild(s);}else doExportXLSX();
}
function doExportXLSX(){
  let mr=0,mc=0;for(const[k]of sheet().cells){const[r,c]=k.split(',').map(Number);if(r>mr)mr=r;if(c>mc)mc=c;}
  const aoa=[];for(let r=0;r<=mr;r++){const row=[];for(let c=0;c<=mc;c++){const cell=getCell(r,c),v=cell?(cell.formula?evalFormula(cell.formula,r,c):cell.raw):'';row.push(v??'');}aoa.push(row);}
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(aoa);XLSX.utils.book_append_sheet(wb,ws,sheet().name);XLSX.writeFile(wb,`${sheet().name}.xlsx`);
}
function exportPDF(){window.print();}
function download(content,filename,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:mime}));a.download=filename;a.click();}

// ── Save/Load ──
function saveToLocal(){
  const data=sheets.map(s=>({name:s.name,cells:[...s.cells.entries()],colWidths:s.colWidths,rowHeights:s.rowHeights}));
  localStorage.setItem('myexcel_data',JSON.stringify({sheets:data,curSheet,sel}));
  document.getElementById('status-left').textContent='Saved ✓';
  setTimeout(()=>document.getElementById('status-left').textContent='Ready',2000);
}
function loadFromLocal(){
  const raw=localStorage.getItem('myexcel_data');if(!raw)return;
  try{const{sheets:d,curSheet:cs,sel:s}=JSON.parse(raw);sheets=d.map(sh=>({name:sh.name,cells:new Map(sh.cells),colWidths:sh.colWidths||{},rowHeights:sh.rowHeights||{}}));curSheet=cs||0;Object.assign(sel,s||{r:0,c:0,r2:0,c2:0});}catch(e){console.error(e);}
}
setInterval(saveToLocal,30000);

// ── Print ──
const ps=document.createElement('style');
ps.textContent=`@media print{#titlebar,#ribbon-tabs,#ribbon,#fbar,#tabs-bar,#statusbar,#hscroll,#vscroll{display:none!important}body{overflow:visible!important;height:auto!important}#sheet-area{overflow:visible!important;height:auto!important}#grid-wrap{overflow:visible!important;height:auto!important}canvas{display:none!important}#print-table{display:table!important}}#print-table{display:none;width:100%;border-collapse:collapse;font:11px Calibri,Arial}#print-table td,#print-table th{border:1px solid #ccc;padding:2px 4px;white-space:nowrap}`;
document.head.appendChild(ps);
window.addEventListener('beforeprint',()=>{
  let mr=0,mc=0;for(const[k]of sheet().cells){const[r,c]=k.split(',').map(Number);if(r>mr)mr=r;if(c>mc)mc=c;}
  mr=Math.min(mr,999);mc=Math.min(mc,50);
  let html='<table id="print-table"><tr><th></th>';
  for(let c=0;c<=mc;c++)html+=`<th>${colLabel(c)}</th>`;html+='</tr>';
  for(let r=0;r<=mr;r++){html+=`<tr><th>${r+1}</th>`;for(let c=0;c<=mc;c++){const cell=getCell(r,c),v=cell?(cell.formula?evalFormula(cell.formula,r,c):cell.raw):'';html+=`<td>${v??''}</td>`;}html+='</tr>';}
  html+='</table>';const pt=document.getElementById('print-table');if(pt)pt.remove();document.getElementById('sheet-area').insertAdjacentHTML('afterend',html);
});

// ── Init ──
loadFromLocal();
window.addEventListener('resize',resize);
resize();renderAll();
canvas.setAttribute('tabindex','0');canvas.focus();
</script>
